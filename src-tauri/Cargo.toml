[package]
name = "bb-attribute-labeler"
version = "0.1.0"
description = "Bounding box attribute labeler"
authors = ["palexy"]
edition = "2021"

[lib]
name = "bb_attribute_labeler_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
